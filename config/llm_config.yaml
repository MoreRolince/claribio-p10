llm:
  model_path: "models/mistral-7b-instruct-v0.2.Q4_K_M.gguf"
  n_threads: 4
  n_ctx: 4096
  n_batch: 512
  temperature: 0.1
  max_tokens: 1024
  verbose: false

rag:
  collection_name: "medical_corpus"
  chroma_persist_dir: "data/chroma_db"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 512
  chunk_overlap: 50
  top_k: 3